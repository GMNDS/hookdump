services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hookdump-backend
    environment:
      - DATABASE_PATH=/app/data/hookdump.db
      - MAX_EVENTS_PER_HOOK=100
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hookdump-backend.entrypoints=websecure"
      - "traefik.http.routers.hookdump-backend.rule=Host(`backhook.${HOOKDUMP_DOMAIN}`)"
      - "traefik.http.routers.hookdump-backend.tls=true"
      - "traefik.http.routers.hookdump-backend.tls.certresolver=cf"
      - "traefik.http.services.hookdump-backend.loadbalancer.server.port=3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hookdump-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hookdump-frontend.entrypoints=websecure"
      - "traefik.http.routers.hookdump-frontend.rule=Host(`fronthook.${HOOKDUMP_DOMAIN}`)"
      - "traefik.http.routers.hookdump-frontend.tls=true"
      - "traefik.http.routers.hookdump-frontend.tls.certresolver=cf"
      - "traefik.http.services.hookdump-frontend.loadbalancer.server.port=80"

volumes:
  hookdump-data:

networks:
  traefik_proxy:
    external: true
